<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/archivos.css">
    <title>archivos</title>
</head>

<body>
    <header>💖 No hay partidos para hoy</header>
    <!-- Contenedor principal con scroll -->
    <main class="content-estadisticas">
        <div style="display:flex; justify-content:center; padding: 1rem 0;">
            <div
                style="background:#fff; border:1px solid #e0e0e0; border-radius:14px; width:280px; overflow:hidden; display:flex; flex-direction:column; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">

                <div style="padding:14px 16px 10px; border-bottom:1px solid #eee;">
                    <p style="margin:0; font-size:14px; font-weight:600;">📍 Estadio BBVA</p>
                    <p style="margin:2px 0 0; font-size:12px; color:#888;">Guadalupe, Nuevo León</p>
                </div>

                <div style="width:100%; height:220px;">
                    <iframe width="100%" height="100%" style="border:none; display:block;" loading="lazy"
                        allowfullscreen src="https://maps.google.com/maps?q=Estadio+BBVA+Monterrey&output=embed&z=15">
                    </iframe>
                </div>

                <div style="padding:12px 16px;">
                    <button onclick="iniciarRuta()"
                        style="width:100%; padding:10px; font-size:13px; font-weight:500; cursor:pointer; background:#fff; border:1px solid #ccc; border-radius:8px;">
                        Cómo llegar desde aquí
                    </button>
                    <p id="status-msg"
                        style="margin:6px 0 0; font-size:11px; color:#999; text-align:center; min-height:14px;"></p>
                </div>

            </div>
        </div>

        <script>
            function iniciarRuta() {
                const msg = document.getElementById('status-msg');
                const destino = 'Estadio+BBVA+Guadalupe+Nuevo+Leon+Mexico';

                if (!navigator.geolocation) {
                    msg.textContent = 'Tu navegador no soporta geolocalización.';
                    return;
                }

                msg.textContent = 'Obteniendo ubicación...';

                navigator.geolocation.getCurrentPosition(
                    function (pos) {
                        const lat = pos.coords.latitude;
                        const lng = pos.coords.longitude;
                        const url = `https://www.google.com/maps/dir/${lat},${lng}/${destino}`;
                        window.open(url, '_blank');
                        msg.textContent = 'Ruta abierta en Google Maps ✓';
                    },
                    function (err) {
                        if (err.code === err.PERMISSION_DENIED) {
                            msg.textContent = 'Permiso denegado. Activa la ubicación.';
                        } else {
                            msg.textContent = 'No se pudo obtener la ubicación.';
                        }
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            }
        </script>


    </main>

    <footer class="menu-compact">
        <a href="index.html" class="home-2-link">
            <div class="boton"><img src="assets/ini.jpg"></div>
        </a>
        <a href="tarjetas.html" class="container-2-link">
            <div class="boton">
                <img src="assets/filtro.jpg">
            </div>
        </a>
        <a href="quiz.html" class="container-2-link">
            <div class="boton">
                <img src="assets/quiz.jpg">
            </div>
        </a>
        <a href="archivos.html" class="container-2-link">
            <div class="boton">
                <img src="assets/archivo.jpg">
            </div>
        </a>
    </footer>
</body>

</html>
