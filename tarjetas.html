<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/tarjetas.css">
    <link rel="stylesheet" href="CSS/Carta.css">
    <title>tarjetas</title>

    <style>
        .card.bloqueada img {
            filter: grayscale(1) brightness(0.35);
            pointer-events: none;
            user-select: none;
        }

        .card.bloqueada::after {
            content: " ";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            pointer-events: none;
        }

        .card {
            position: relative;

        }

        @keyframes revealCard {
            from {
                opacity: 0;
                transform: scale(0.85) rotateY(30deg);
            }

            to {
                opacity: 1;
                transform: scale(1) rotateY(0deg);
            }
        }

        .card.desbloqueada {
            animation: revealCard 0.45s ease both;
        }

        .coleccion-header {
            grid-column: 1 / -1;
            text-align: center;
            padding: 8px 0 4px;
            font-size: 0.85rem;
            opacity: 0.7;
            letter-spacing: 0.05em;
        }
    </style>
</head>

<body>

    <main class="content-estadisticas">

        <p class="coleccion-header" id="contador-coleccion"></p>

        <div class="card" data-codigo="WC26_001">
            <img src="tarjetas/LAINEZ.png" alt="Lainez">
        </div>
        <div class="card" data-codigo="WC26_002">
            <img src="tarjetas/HEUNG-MIN.png" alt="Heung-Min">
        </div>
        <div class="card" data-codigo="WC26_003">
            <img src="tarjetas/MESSI.png" alt="Messi">
        </div>
        <div class="card" data-codigo="WC26_004">
            <img src="tarjetas/MBAPPÉ.png" alt="Mbappé">
        </div>
        <div class="card" data-codigo="WC26_005">
            <img src="tarjetas/COURTOIS.png" alt="Courtois">
        </div>
        <div class="card" data-codigo="WC26_006">
            <img src="tarjetas/MEXICO.png" alt="México">
        </div>
        <div class="card" data-codigo="WC26_007">
            <img src="tarjetas/COREA.png" alt="Corea">
        </div>
        <div class="card" data-codigo="WC26_008">
            <img src="tarjetas/ARGENTINA.png" alt="Argentina">
        </div>
        <div class="card" data-codigo="WC26_009">
            <img src="tarjetas/ALEMANIA.png" alt="Alemania">
        </div>
        <div class="card" data-codigo="WC26_010">
            <img src="tarjetas/JAPON.png" alt="Japón">
        </div>
        <div class="card" data-codigo="WC26_011">

    </main>

    <footer class="menu-compact">
        <a href="index.html" class="home-2-link">
            <div class="boton"><img src="assets/ini.jpg"></div>
        </a>
        <a href="tarjetas.html" class="container-2-link">
            <div class="boton">
                <img src="assets/filtro.jpg">
            </div>

        <a href="quiz.html" class="container-2-link">

        <a href="archivos.html" class="container-2-link">
            <div class="boton">

            </div>
        </a>
    </footer>

    <script src="tarjetas.js"></script>
    <script>
        const cards = document.querySelectorAll(".card[data-codigo]");
        const estado = getEstado();
        let desbloqueadas = 0;

        cards.forEach((card, i) => {
            const codigo = card.dataset.codigo;
            if (estado[codigo]) {
                card.classList.add("desbloqueada");
                card.style.animationDelay = `${i * 40}ms`;
                desbloqueadas++;
            } else {
                card.classList.add("bloqueada");
            }
        });

        document.getElementById("contador-coleccion").textContent =
            `Colección: ${desbloqueadas} / ${cards.length}`;
    </script>
</body>

</html>
