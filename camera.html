<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/camera.css">
    <title>Camera</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <style>
        #preview-tarjeta {
            display: none;
            width: 120px;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
            margin: 8px auto 0;
            transition: opacity 0.3s ease;
            opacity: 0;
        }

        #preview-tarjeta.visible {
            display: block;
            opacity: 1;
        }


        .boton-guardar-carta.activo {
            background: #22c55e;
            color: #fff;
            cursor: pointer;
        }

        .boton-guardar-carta.ya-guardada {
            background: #64748b;
            color: #fff;
            cursor: default;
        }

        @keyframes flash-verde {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
                background: #16a34a;
            }

            100% {
                transform: scale(1);
            }
        }

        .boton-guardar-carta.guardado-flash {
            animation: flash-verde 0.6s ease;
        }
    </style>
</head>

<body>
    <header>💖 No hay partidos para hoy</header>

    <main class="content-capture">
        <canvas id="Cam"></canvas>

        <div class="data-card-container">
            <div class="data-card-top">
                <label class="switch-container">
                    <input type="checkbox" class="switch-input" id="modoSwitch" />
                </label>

                <div class="Info-data">
                    <h3 id="mensaje">Cargando cámara...</h3>
                </div>
            </div>


            <img id="preview-tarjeta" src="" alt="Tarjeta detectada">

            <div class="boton-guardar-carta">Guardar</div>
            <a href="Ar-1.html" class="boton-ar">AR</a>
        </div>
    </main>

    <footer class="menu-compact">
        <a href="index.html" class="home-2-link">
            <div class="boton"><img src="assets/ini.jpg"></div>
        </a>
        <a href="tarjetas.html" class="container-2-link">
            <div class="boton">
                <img src="assets/filtro.jpg">
            </div>
        </a>
        <a href="quiz.html" class="container-2-link">
            <div class="boton">
                <img src="assets/quiz.jpg">
            </div>
        </a>
        <a href="archivos.html" class="container-2-link">
            <div class="boton">
                <img src="assets/archivo.jpg">
            </div>
        </a>
    </footer>


    <script src="tarjetas.js"></script>
    <script async src="capture.js"></script>
</body>

</html>
