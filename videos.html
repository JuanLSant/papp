<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/videos.css">
    <title>Videos</title>
</head>

<body>
    <header>💖 No hay partidos para hoy</header>

    <main class="content-estadisticas">

        <div class="upload-area">
            <label class="upload-btn" for="fileInput">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="17 8 12 3 7 8" />
                    <line x1="12" y1="3" x2="12" y2="15" />
                </svg>
                Subir nuevo video
            </label>
            <input type="file" id="fileInput" accept="video/*" multiple style="display:none;">
        </div>

        <div class="container-5-estadisticas">
            <div class="Video-frame-H" style="cursor:pointer;"
                onclick="window.location.href='filtro-videos.html?video=videos/Video-test.mp4'">
                <video width="100%" style="pointer-events:none;">
                    <source src="videos/Video-test.mp4" type="video/mp4">
                </video>
                <p style="color:#aaa;text-align:center;font-size:12px;margin:4px 0;">Click para abrir con filtros</p>
            </div>

            <div class="Video-frame-H" id="slot-1"></div>
            <div class="Video-frame-H" id="slot-2"></div>
            <div class="Video-frame-H" id="slot-3"></div>
            <div class="Video-frame-H" id="slot-4"></div>
        </div>

    </main>

    <footer class="menu-compact">
        <a href="index.html" class="home-2-link">
            <div class="boton"><img src="assets/ini.jpg"></div>
        </a>
        <a href="tarjetas.html" class="container-2-link">
            <div class="boton"><img src="assets/filtro.jpg"></div>
        </a>
        <a href="quiz.html" class="container-2-link">
            <div class="boton"><img src="assets/quiz.jpg"></div>
        </a>
        <a href="archivos.html" class="container-2-link">
            <div class="boton"><img src="assets/archivo.jpg"></div>
        </a>
    </footer>

    <script>
        // ── IndexedDB helper ─────────────────────────────────────────────────────────
        const DB_NAME = 'videosDB';
        const DB_VERSION = 1;
        const STORE = 'videos';

        function abrirDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = e => {
                    e.target.result.createObjectStore(STORE);
                };
                req.onsuccess = e => resolve(e.target.result);
                req.onerror = e => reject(e.target.error);
            });
        }

        async function guardarBlob(key, blob) {
            const db = await abrirDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE, 'readwrite');
                tx.objectStore(STORE).put(blob, key);
                tx.oncomplete = resolve;
                tx.onerror = e => reject(e.target.error);
            });
        }

        // ── Slots ────────────────────────────────────────────────────────────────────
        const slots = ['slot-1', 'slot-2', 'slot-3', 'slot-4'];
        let slotIndex = 0;

        document.getElementById('fileInput').addEventListener('change', async function (e) {
            const files = Array.from(e.target.files);
            for (const file of files) {
                if (slotIndex >= slots.length) slotIndex = 0;
                const slotId = slots[slotIndex];

                // Guarda el Blob real en IndexedDB (soporta videos grandes)
                try {
                    await guardarBlob('video_blob_' + slotId, file);
                } catch (err) {
                    console.error('No se pudo guardar el video en IndexedDB:', err);
                    alert('Error al guardar el video: ' + err.message);
                    slotIndex++;
                    continue;
                }

                const blobUrl = URL.createObjectURL(file);
                const slot = document.getElementById(slotId);
                slot.style.cursor = 'pointer';
                slot.onclick = () => abrirConFiltro(slotId);
                slot.innerHTML = `
                    <video width="100%" style="pointer-events:none;" autoplay muted loop>
                        <source src="${blobUrl}" type="video/mp4">
                    </video>
                    <p style="color:#aaa;text-align:center;font-size:12px;margin:4px 0;">${file.name}</p>
                `;
                slotIndex++;
            }
            this.value = '';
        });

        function abrirConFiltro(slotId) {
            window.location.href = 'filtro-videos.html?slot=' + slotId;
        }
    </script>
</body>

</html>
